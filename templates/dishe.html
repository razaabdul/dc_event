<!DOCTYPE html>
<html>
<head>
    <title>Manage Dishes</title>
    <style>
        .dish-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 15px;
            display: inline-block;
            width: 250px;
            vertical-align: top;
            border-radius: 8px;
            background: #fff;
        }
        .dish-card h3 { margin: 0 0 5px; }
        form input, form select, form textarea {
            margin-bottom: 10px;
            width: 100%;
            padding: 8px;
        }
        .actions button { margin-right: 5px; }
    </style>
</head>
<body>
    <h1>Dish Management Dashboard</h1>

    <form method="POST" action="{{ url_for('add_dish') }}" enctype="multipart/form-data">
    <h3>Add New Dish</h3>
    
    <!-- Dish Name -->
    <input type="text" name="name" placeholder="Dish Name" required>
    
    <!-- Cuisine -->
    <input type="text" name="cuisine" placeholder="Cuisine (e.g. Indian, Chinese)" required>
    
    <!-- Veg/Non-Veg -->
    <label>
        <input type="radio" name="veg" value="True" checked> Veg
    </label>
    <label>
        <input type="radio" name="veg" value="False"> Non-Veg
    </label>
    
    <!-- Category (optional, if you keep it) -->
    <select name="category">
        <option value="">-- Select Category --</option>
        <option value="Appetizer">Appetizer</option>
        <option value="Main Course">Main Course</option>
        <option value="Dessert">Dessert</option>
    </select>
          
    <!-- Price -->
    <input type="number" name="price" placeholder="Price (₹)" required>
    
    <!-- Image Upload -->
    <input type="file" name="image" accept="image/*">
    
    <!-- Description -->
    <textarea name="description" placeholder="Description"></textarea>
    
    <!-- Submit -->
    <button type="submit">Add Dish</button>
</form>


    <hr>

    {% for dish in dishes %}
    <div class="dish-card">
        <h3>{{ dish.name }} - ₹{{ dish.price }}</h3>
        <small>{{ dish.category }}</small>
        <p>{{ dish.description }}</p>

        <form action="{{ url_for('edit_dish', id=dish.id) }}" method="POST">
            <input type="text" name="name" value="{{ dish.name }}" required>
            <input type="text" name="category" value="{{ dish.category }}" required>
            <input type="number" name="price" value="{{ dish.price }}" required>
            <textarea name="description">{{ dish.description }}</textarea>
            <div class="actions">
                <button type="submit">Update</button>
                <a href="{{ url_for('delete_dish', id=dish.id) }}" onclick="return confirm('Delete dish?')">Delete</a>
            </div>
        </form>
    </div>
    {% endfor %}
</body>
</html>
