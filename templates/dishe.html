<!DOCTYPE html>
<html>
<head>
    <title>Manage Dishes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .dashboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .stats {
            background: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-size: 18px;
            font-weight: bold;
        }

        .container {
            display: flex;
            gap: 30px;
            padding: 20px;
        }

        /* Left side - Add Dish Form */
        .form-section {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .form-section h2 {
            margin-bottom: 15px;
        }

        form input, form select, form textarea, form button {
            width: 100%;
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        form button {
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        form button:hover {
            background: #45a049;
        }

        /* Right side - Dish List */
        .dish-list {
            flex: 2;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .dish-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .dish-card h3 {
            margin: 0 0 8px;
            font-size: 18px;
            color: #4CAF50;
        }

        .dish-card small {
            color: #888;
        }

        .dish-card p {
            margin: 8px 0;
            font-size: 14px;
        }

        .dish-card form input, 
        .dish-card form textarea {
            margin-bottom: 8px;
        }

        .actions {
            display: flex;
            justify-content: space-between;
        }

        .actions button {
            flex: 1;
            margin-right: 5px;
            background: #2196F3;
        }

        .actions button:hover {
            background: #1976D2;
        }
.form-container {
    display: flex;
    justify-content: center;
    margin: 20px 0;
}
        .actions a {
            flex: 1;
            display: inline-block;
            text-align: center;
            padding: 10px;
            background: #f44336;
            color: white;
            border-radius: 6px;
            text-decoration: none;
        }

        .actions a:hover {
            background: #d32f2f;
        }
        .form-card {
    background: #f8f9fa;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
    max-width: 500px;
    width: 100%;
}

.form-card h2 {
    margin-bottom: 20px;
    text-align: center;
    color: #333;
}

.form-card label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
    color: #444;
}

.form-card input[type="text"],
.form-card input[type="number"],
.form-card select,
.form-card textarea,
.form-card input[type="file"] {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

.radio-group {
    display: flex;
    gap: 15px;
    margin-top: 6px;
}

.image-preview {
    margin-top: 10px;
}

.image-preview img {
    border-radius: 8px;
    box-shadow: 0px 2px 6px rgba(0,0,0,0.15);
}

.actions {
    text-align: center;
    margin-top: 20px;
}

.actions button {
    background: #007bff;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

.actions button:hover {
    background: #0056b3;
}
    </style>
</head>
<body>
  
    <header>
        <h1>Dish Management Dashboard</h1>
    </header>

    <div class="dashboard">
        <div class="stats">
            🍽️ Total Dishes: <strong>{{ total }}</strong>
        </div>
    </div>

    <div class="container">
        <!-- Left: Add New Dish -->
        <div class="form-section">
            <h2>Add New Dish</h2>
            <form method="POST" action="{{ url_for('add_dish') }}" enctype="multipart/form-data">
                <input type="text" name="name" placeholder="Dish Name" required>
                <input type="text" name="cuisine" placeholder="Cuisine (e.g. Indian, Chinese)" required>
                
                <label><input type="radio" name="veg" value="True" checked> Veg</label>
                <label><input type="radio" name="veg" value="False"> Non-Veg</label>
                
                <select name="category">
                    <option value="">-- Select Category --</option>
                    <option value="Appetizer">Appetizer</option>
                    <option value="Main Course">Main Course</option>
                    <option value="Dessert">Dessert</option>
                </select>
                
                <input type="number" name="price" placeholder="Price (₹)" required>
                <input type="file" name="image" accept="image/*">
                <textarea name="description" placeholder="Description"></textarea>
                <button type="submit">➕ Add Dish</button>
            </form>
        </div>

        <!-- Right: Dish List -->
        <div class="dish-list">
            {% for dish in dishes %}
            <div class="dish-card">
                <!-- Dish Image -->
    {% if dish.image %}
        <img src="{{ url_for('static', filename='uploads/images/' + dish.image) }}" alt="{{ dish.name }}" style="width:100%; height:160px; object-fit:cover; border-radius:8px; margin-bottom:10px;">
    {% else %}
        <img src="{{ url_for('static', filename='images/placeholder.jpg') }}" alt="No Image" style="width:100%; height:160px; object-fit:cover; border-radius:8px; margin-bottom:10px;">
    {% endif %}

    <!-- Dish Details -->
<form action="{{ url_for('edit_dish', dish_id=dish.id) }}" method="POST" enctype="multipart/form-data" class="form-container">

    <div class="form-card">
        <h2>Edit Dish</h2>

        <!-- Dish Name -->
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ dish.name }}" required>

        <!-- Category Dropdown -->
        <label for="category">Category:</label>
        <select id="category" name="category" required>
            <option value="">-- Select Category --</option>
            <option value="Appetizer" {% if dish.category == "Appetizer" %}selected{% endif %}>Appetizer</option>
            <option value="Main Course" {% if dish.category == "Main Course" %}selected{% endif %}>Main Course</option>
            <option value="Dessert" {% if dish.category == "Dessert" %}selected{% endif %}>Dessert</option>
        </select>

        <!-- Price -->
        <label for="price">Price (₹):</label>
        <input type="number" id="price" name="price" value="{{ dish.price }}" required>

        <!-- Cuisine -->
        <label for="cuisine">Cuisine:</label>
        <input type="text" id="cuisine" name="cuisine" value="{{ dish.cuisine }}" required>

        <!-- Veg/Non-Veg -->
        <label>Type:</label>
        <div class="radio-group">
            <label><input type="radio" name="veg" value="True" {% if dish.veg %}checked{% endif %}> Veg</label>
            <label><input type="radio" name="veg" value="False" {% if not dish.veg %}checked{% endif %}> Non-Veg</label>
        </div>

        <!-- Description -->
        <label for="description">Description:</label>
        <textarea id="description" name="description">{{ dish.description }}</textarea>

        <!-- Image Upload -->
        <label for="image">Update Image:</label>
        <input type="file" id="image" name="image" accept="image/*">

        <!-- Current Image Preview -->


        <!-- Submit -->
        <div class="actions">
            <button type="submit">✏️ Update</button>
        </div>
    </div>
</form>

<form action="{{ url_for('delete_dish', dish_id=dish.id) }}" method="POST" style="display:inline;">
    <button type="submit" onclick="return confirm('Delete this dish?')">🗑️ Delete</button>
</form>           
</div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
